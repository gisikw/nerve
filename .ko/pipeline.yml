# Build pipeline -- triage, implement, verify, review
#
# Triage is a decision node: it evaluates the ticket and either continues
# to implementation or signals fail/blocked/decompose via a JSON disposition.
#
# Implement and verify are action nodes: they just do work, no output parsing.
#
# Review is a decision node: it evaluates the implementation and either
# continues (succeed) or signals fail.
#
# Verify runs inside `nix develop` to get cargo, node, GTK libs, etc.
# First run may be slow (nix eval); subsequent runs hit the store cache.
# `just test` runs frontend build first (fast fail) then cargo test.
model: claude-sonnet-4-6-20250929
max_retries: 2
max_depth: 2
discretion: medium

workflows:
  main:
    - name: triage
      type: decision
      prompt: triage.md
    - name: implement
      type: action
      prompt: implement.md
      allow_all_tool_calls: true
    - name: verify
      type: action
      run: nix develop --command just test
    - name: review
      type: decision
      prompt: review.md
      allow_all_tool_calls: true

# Auto-commit on success. Ticket ID goes in the message so `ko close`
# can record the SHA range.
on_succeed:
  - git add -A
  - git commit -m "ko: implement ${TICKET_ID}"
